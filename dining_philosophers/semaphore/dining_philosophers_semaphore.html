o": 1, "state": "eating", "note": "has forks 1 and 2", "forks": [3, 1, 1, 3]}, {"time": 1.42, "who": 2, "state": "hungry", "note": "wants to eat", "forks": [3, 1, 1, 3]}, {"time": 1.42, "who": 2, "state": "acquiring", "note": "picking up forks", "forks": [3, 1, 1, 3]}, {"time": 1.422, "who": 0, "state": "hungry", "note": "wants to eat", "forks": [3, 1, 1, 3]}, {"time": 1.539, "who": 1, "state": "releasing", "note": "putting forks down", "forks": [3, 1, 1, 3]}, {"time": 1.539, "who": 1, "state": "thinking", "note": "", "forks": [3, -1, -1, 3]}, {"time": 1.539, "who": 2, "state": "acquiring", "note": "has left fork 2", "forks": [3, -1, 2, 3]}, {"time": 1.539, "who": 0, "state": "acquiring", "note": "picking up forks", "forks": [3, -1, 2, 3]}, {"time": 1.668, "who": 1, "state": "hungry", "note": "wants to eat", "forks": [3, -1, 2, 3]}, {"time": 1.766, "who": 3, "state": "releasing", "note": "putting forks down", "forks": [3, -1, 2, 3]}, {"time": 1.766, "who": 3, "state": "thinking", "note": "", "forks": [-1, -1, 2, -1]}, {"time": 1.766, "who": 1, "state": "acquiring", "note": "picking up forks", "forks": [-1, -1, 2, -1]}, {"time": 1.766, "who": 1, "state": "acquiring", "note": "has left fork 1", "forks": [-1, 1, 2, -1]}, {"time": 1.766, "who": 0, "state": "acquiring", "note": "has left fork 0", "forks": [0, 1, 2, -1]}, {"time": 1.766, "who": 2, "state": "eating", "note": "has forks 2 and 3", "forks": [0, 1, 2, 2]}, {"time": 1.868, "who": 3, "state": "hungry", "note": "wants to eat", "forks": [0, 1, 2, 2]}, {"time": 2.341, "who": 2, "state": "releasing", "note": "putting forks down", "forks": [0, 1, 2, 2]}, {"time": 2.341, "who": 1, "state": "eating", "note": "has forks 1 and 2", "forks": [0, 1, 1, -1]}, {"time": 2.341, "who": 3, "state": "acquiring", "note": "picking up forks", "forks": [0, 1, 1, -1]}, {"time": 2.341, "who": 3, "state": "acquiring", "note": "has left fork 3", "forks": [0, 1, 1, 3]}, {"time": 2.669, "who": 1, "state": "releasing", "note": "putting forks down", "forks": [0, 1, 1, 3]}, {"time": 2.669, "who": 0, "state": "eating", "note": "has forks 0 and 1", "forks": [0, 0, -1, 3]}, {"time": 3.097, "who": 0, "state": "releasing", "note": "putting forks down", "forks": [0, 0, -1, 3]}, {"time": 3.097, "who": 0, "state": "thinking", "note": "", "forks": [-1, -1, -1, 3]}, {"time": 3.097, "who": 3, "state": "eating", "note": "has forks 3 and 0", "forks": [3, -1, -1, 3]}, {"time": 3.402, "who": 3, "state": "releasing", "note": "putting forks down", "forks": [3, -1, -1, 3]}, {"time": 3.651, "who": 0, "state": "hungry", "note": "wants to eat", "forks": [-1, -1, -1, -1]}, {"time": 3.651, "who": 0, "state": "acquiring", "note": "picking up forks", "forks": [-1, -1, -1, -1]}, {"time": 3.651, "who": 0, "state": "acquiring", "note": "has left fork 0", "forks": [0, -1, -1, -1]}, {"time": 3.651, "who": 0, "state": "eating", "note": "has forks 0 and 1", "forks": [0, 0, -1, -1]}, {"time": 3.838, "who": 0, "state": "releasing", "note": "putting forks down", "forks": [0, 0, -1, -1]}];
var N = 4;
var index = 0;
var timer = null;
var states = [];
var owner = [];
var colours = { thinking: "#888", hungry: "#e0a000", acquiring: "#8040c0",
                eating: "#2a8a2a", releasing: "#3070c0" };

function resetData() {
  states = [];
  owner = [];
  for (var i = 0; i < N; i++) { states.push("thinking"); owner.push(-1); }
}

function pos(angle, r) {
  var a = angle * Math.PI / 180 - Math.PI / 2;
  return [200 + r * Math.cos(a), 200 + r * Math.sin(a)];
}

function draw() {
  var s = "<svg width='400' height='400' style='background:white;border:1px solid #aaa'>";
  s += "<circle cx='200' cy='200' r='85' fill='#e8d8b8' stroke='#999'/>";
  for (var i = 0; i < N; i++) {
    var q = pos(i * 90, 150);
    s += "<circle cx='" + q[0] + "' cy='" + q[1] + "' r='38' fill='" + colours[states[i]] + "'/>";
    s += "<text x='" + q[0] + "' y='" + (q[1] - 3) + "' fill='white' font-size='13' text-anchor='middle'>P" + i + "</text>";
    s += "<text x='" + q[0] + "' y='" + (q[1] + 12) + "' fill='white' font-size='10' text-anchor='middle'>" + states[i] + "</text>";
  }
  var info = "<b>Fork ownership</b><br>";
  for (var k = 0; k < N; k++) {
    var base = pos(k * 90 - 45, 95);
    var p = base;
    var colour = "#2a8a2a";
    if (owner[k] >= 0) {
      var ph = pos(owner[k] * 90, 140);
      p = [base[0] + 0.6 * (ph[0] - base[0]), base[1] + 0.6 * (ph[1] - base[1])];
      colour = "#c03030";
      info += "Fork " + k + ": held by P" + owner[k] + "<br>";
    } else {
      info += "Fork " + k + ": free<br>";
    }
    s += "<circle cx='" + p[0] + "' cy='" + p[1] + "' r='11' fill='" + colour + "'/>";
    s += "<text x='" + p[0] + "' y='" + (p[1] + 4) + "' font-size='11' fill='white' text-anchor='middle'>F" + k + "</text>";
  }
  s += "</svg>";
  document.getElementById("picture").innerHTML = s;
  document.getElementById("forks").innerHTML = info;
}

function step() {
  if (index >= events.length) { pauseSim(); return; }
  var e = events[index];
  states[e.who] = e.state;
  owner = e.forks.slice();
  draw();
  var line = "[" + e.time + "s] P" + e.who + " -> " + e.state + " " + e.note;
  document.getElementById("log").innerHTML += line + "<br>";
  document.getElementById("log").scrollTop = 99999;
  index++;
}

function start() {
  if (timer) return;
  timer = setInterval(step, document.getElementById("speed").value);
}
function pauseSim() { clearInterval(timer); timer = null; }
function resetSim() {
  pauseSim();
  index = 0;
  resetData();
  document.getElementById("log").innerHTML = "";
  draw();
}
resetData();
draw();
</script>
</body>
